name: ArcanaSheet CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Typecheck, Unit & Rules Tests, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21 (Required for Firebase Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Typecheck (TypeScript)
        run: npx tsc -b

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Run Firestore Security Rules Tests (Emulator)
        run: npm run test:rules

      - name: Build Web Application
        run: npm run build
